services:
  revenuegenius_nextjs_test:
    restart: unless-stopped
    container_name: revenuegenius_nextjs_test
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000" # Utiliser un port différent
    networks:
      - revenuegenius_frontend_test
    env_file:
      - .env.test

networks:
  revenuegenius_frontend_test:
    external: true
